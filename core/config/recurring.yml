# Tarefas recorrentes do Solid Queue, executadas pelo serviço jobs-default.
#   close_expired_conversations: fecha as conversas resolvidas com prazo de reabertura vencido;
#   sweep_mailpit:               traz do Mailpit os e-mails que o webhook perdeu.
development: &channels
  close_expired_conversations:
    class: Conversations::CloseExpiredJob
    queue: default
    schedule: every minute
  sweep_mailpit:
    class: Channels::Email::SweepJob
    queue: default
    schedule: every minute

production:
  <<: *channels
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

# Processo jobs-default (bin/jobs): todas as filas, exceto webhooks, que fica no jobs-webhooks
# (config/queue_webhooks.yml).
#   channels:                    entrega das respostas aos canais; entra na latência ponta a ponta,
#                                por isso o worker próprio com polling de 0,1 s;
#   default:                     ingestão e varredura do Mailpit, prazo de reabertura;
#   action_mailbox_routing:      roteamento dos e-mails recebidos;
#   action_mailbox_incineration: incineração dos e-mails processados.
# Cada worker usa threads + 2 conexões do pool (RAILS_MAX_THREADS).
default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: [ channels ]
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1
    - queues: [ default, action_mailbox_routing, action_mailbox_incineration ]
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default

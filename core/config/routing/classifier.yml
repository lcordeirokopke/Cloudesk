# Palavras-chave do classificador de entrada (Routing::Classifier), por marca.
#   version:    versão das listas da marca; vai para o audit_event conversation.classified.
#   categories: categoria => listas. As categorias são as skills das equipes.
#     terms:    palavras e expressões próprias da categoria; peso 2.
#     context:  palavras comuns a vários assuntos, que só indicam a categoria; peso 1.
#   urgency:    palavras e expressões que dão urgência high; sem nenhuma, a urgência é normal.
#
# Caixa e acentos não importam: texto e palavras passam pela mesma normalização. Cada palavra ou
# expressão casa inteira, com limites de palavra. Quando duas casam no mesmo trecho do texto, conta
# só a mais longa. A pontuação de uma categoria é a soma dos pesos das palavras casadas, cada uma
# contada uma vez; vence a maior, e no empate a primeira categoria desta lista.
#
# Toda mudança nas listas aumenta a version e passa pelo corpus de
# spec/fixtures/routing/classifier_corpus.yml.

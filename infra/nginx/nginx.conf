# Balanceador do web-lb: recebe na porta 3000 (host e rede do Compose) e distribui as requisições
# HTTP e o WebSocket do Action Cable (/cable) entre as réplicas do serviço web
# (docker compose up --scale web=N).
#
# O upstream resolve o nome web pelo DNS do Docker a cada 5 s (resolve no server, com zone), e as
# réplicas novas entram no balanceamento sem reiniciar o nginx. O Host original segue com a porta
# ($http_host): o Action Cable compara o Origin com o Host, e os redirects do Rails usam a porta.
# Sem log de acesso: o salto do balanceador fica fora da medida, e o received_at de cada requisição
# continua sendo o do TraceContextMiddleware do Core.
events {
  worker_connections 4096;
}

http {
  access_log off;

  # DNS embutido do Docker.
  resolver 127.0.0.11 valid=5s ipv6=off;

  upstream web {
    zone web 64k;
    server web:3000 resolve;
    keepalive 32;
  }

  # Upgrade do WebSocket: Connection: upgrade só quando o cliente pede o upgrade; nas demais
  # requisições, Connection vazio, para reaproveitar a conexão do keepalive.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
  }

  server {
    listen 3000;

    # Os canais mandam só JSON e metadados de anexo; o padrão do nginx cobre os corpos aceitos.
    client_max_body_size 1m;

    location / {
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      # O traceparent do cliente segue sem alteração (o nginx repassa os headers da requisição).
      proxy_read_timeout 3600s;
    }
  }
}

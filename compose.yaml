name: cloudesk

x-rails: &rails
  build:
    context: ./core
    dockerfile: Dockerfile.dev
  image: cloudesk-core:dev
  environment: &rails-environment
    RAILS_ENV: development
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_USERNAME: ${DB_APP_USERNAME}
    DB_PASSWORD: ${DB_APP_PASSWORD}
    DB_APP_USERNAME: ${DB_APP_USERNAME}
    DB_OWNER_USERNAME: ${DB_OWNER_USERNAME}
    DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD}
    DB_DEVELOPMENT_NAME: ${DB_DEVELOPMENT_NAME}
    DB_TEST_NAME: ${DB_TEST_NAME}
    CONTRACTS_PATH: /contracts
    MAILPIT_API_URL: http://mailpit:8025
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET}
    WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
    WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
    WHATSAPP_API_URL: ${WHATSAPP_API_URL}
    CHAT_SIGNING_SECRET: ${CHAT_SIGNING_SECRET}
    MAILPIT_WEBHOOK_USER: ${MAILPIT_WEBHOOK_USER}
    MAILPIT_WEBHOOK_PASSWORD: ${MAILPIT_WEBHOOK_PASSWORD}
    BROKER_WEBHOOK_URL: ${BROKER_WEBHOOK_URL}
    BROKER_WEBHOOK_SECRET: ${BROKER_WEBHOOK_SECRET}
    AGENT_ACTIONS_SECRET: ${AGENT_ACTIONS_SECRET}
    AGENT_CONTEXT_SECRET: ${AGENT_CONTEXT_SECRET}
    MISSION_CONTROL_USER: ${MISSION_CONTROL_USER}
    MISSION_CONTROL_PASSWORD: ${MISSION_CONTROL_PASSWORD}
    PANEL_USER: ${PANEL_USER}
    PANEL_PASSWORD: ${PANEL_PASSWORD}
    ADMIN_USER: ${ADMIN_USER}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    # 1 desliga recarregamento de código, carrega o código no boot e reduz os logs (medidas e carga).
    CLOUDESK_LOAD_PROFILE: ${CLOUDESK_LOAD_PROFILE:-}
    # Endpoints da DLQ no broker-web, usados pela tela /admin/dlq.
    BROKER_DLQ_URL: ${BROKER_DLQ_URL:-http://broker-web:3000}
    BROKER_DLQ_SECRET: ${BROKER_DLQ_SECRET}
  volumes:
    - ./core:/rails
    - ./contracts:/contracts:ro
  depends_on:
    postgres:
      condition: service_healthy

services:
  # max_connections cobre a soma das conexões dos processos na configuração da carga, com margem
  # (documents/fases/16-robustez-e-escala.md).
  postgres:
    image: postgres:18
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-200}"]
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      DB_OWNER_USERNAME: ${DB_OWNER_USERNAME}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD}
      DB_APP_USERNAME: ${DB_APP_USERNAME}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      DB_DEVELOPMENT_NAME: ${DB_DEVELOPMENT_NAME}
      DB_TEST_NAME: ${DB_TEST_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.7
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.7
    entrypoint: ["/bin/sh", "/scripts/create-topics.sh"]
    environment:
      KAFKA_BROKERS: redpanda:9092
    volumes:
      - ./infra/redpanda:/scripts:ro
    depends_on:
      redpanda:
        condition: service_healthy
    restart: "no"

  mailpit:
    image: axllent/mailpit
    environment:
      MP_WEBHOOK_URL: http://${MAILPIT_WEBHOOK_USER}:${MAILPIT_WEBHOOK_PASSWORD}@web-lb:3000/channels/email/mailpit
      MP_WEBHOOK_LIMIT: "0"
    ports:
      - "1025:1025"
      - "8025:8025"

  # Puma em modo single em cada réplica, com RAILS_MAX_THREADS threads e o mesmo número de conexões
  # no pool. Sem porta no host: o acesso é pelo web-lb, e o serviço escala com --scale web=N. O pid
  # fica em /tmp, no sistema de arquivos de cada contêiner, fora do volume do código compartilhado
  # pelas réplicas.
  web:
    <<: *rails
    command: ["bin/rails", "server", "-b", "0.0.0.0", "-p", "3000", "-P", "/tmp/server.pid"]
    environment:
      <<: *rails-environment
      RAILS_MAX_THREADS: ${WEB_MAX_THREADS:-3}

  # Balanceador (nginx) na porta 3000 do host e da rede do Compose: distribui HTTP e WebSocket entre
  # as réplicas do web (infra/nginx/nginx.conf).
  web-lb:
    image: nginx:1.30.8-alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "3000:3000"
    depends_on:
      - web

  jobs-default:
    <<: *rails
    command: ["bin/jobs"]

  jobs-webhooks:
    <<: *rails
    command: ["bin/jobs", "--config-file", "config/queue_webhooks.yml", "--skip-recurring"]
    # O worker de 5 threads da fila webhooks usa 7 conexões do pool.
    environment:
      <<: *rails-environment
      RAILS_MAX_THREADS: "7"

  # Broker: mesma imagem do Core, sem Rails e sem banco (core/lib/broker.rb). O ambiente não leva DB_*.
  # O broker-web não publica porta no host: o Core o alcança pelo DNS do Compose, e o serviço escala
  # com --scale broker-web=N.
  broker-web:
    image: cloudesk-core:dev
    command: ["bundle", "exec", "puma", "-C", "config/puma_broker.rb", "broker.ru"]
    environment: &broker-environment
      KARAFKA_REQUIRE_RAILS: "false"
      CONTRACTS_PATH: /contracts
      KAFKA_BROKERS: ${KAFKA_BROKERS:-redpanda:9092}
      BROKER_WEBHOOK_SECRET: ${BROKER_WEBHOOK_SECRET}
      AGENT_ACTIONS_SECRET: ${AGENT_ACTIONS_SECRET}
      BROKER_DLQ_SECRET: ${BROKER_DLQ_SECRET}
      CORE_ACTIONS_URL: ${CORE_ACTIONS_URL:-http://web-lb:3000/api/v1/agent/actions}
    volumes:
      - ./core:/rails
      - ./contracts:/contracts:ro
    healthcheck:
      test: ["CMD-SHELL", "ruby -rnet/http -e 'exit Net::HTTP.get_response(URI(\"http://localhost:3000/up\")).is_a?(Net::HTTPSuccess)'"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      redpanda-init:
        condition: service_completed_successfully

  broker-consumer:
    image: cloudesk-core:dev
    command: ["bundle", "exec", "karafka", "server"]
    environment: *broker-environment
    volumes:
      - ./core:/rails
      - ./contracts:/contracts:ro
    depends_on:
      redpanda-init:
        condition: service_completed_successfully

  channel-simulator:
    build: ./channel_simulator
    image: cloudesk-channel-simulator:dev
    environment:
      CORE_URL: http://web-lb:3000
      CORE_CABLE_URL: ws://web-lb:3000/cable
      CORE_ORIGIN: http://web-lb:3000
      MAILPIT_API_URL: http://mailpit:8025
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      CHAT_SIGNING_SECRET: ${CHAT_SIGNING_SECRET}
      CONTRACTS_PATH: /contracts
      PERSONAS_PATH: /personas/personas.json
      SIMULATOR_DATA_DIR: /app/data
      SIMULATOR_PORT: "8080"
      MAILPIT_POLL_SECONDS: "2"
    volumes:
      - ./channel_simulator:/app
      - ./contracts:/contracts:ro
      - ./core/tmp/simulator:/personas:ro
    ports:
      - "8080:8080"
    depends_on:
      - web-lb
      - mailpit

  # Agente mock: consome agent.inbound no grupo cloudesk-agent e publica as ações em agent.outbound.
  agent-mock:
    build: ./agent_mock
    image: cloudesk-agent-mock:dev
    environment:
      KAFKA_BROKERS: ${KAFKA_BROKERS:-redpanda:9092}
      CORE_URL: http://web-lb:3000
      AGENT_CONTEXT_SECRET: ${AGENT_CONTEXT_SECRET}
      AGENT_LATENCY_MS: ${AGENT_LATENCY_MS:-0}
      AGENT_CONCURRENCY: ${AGENT_CONCURRENCY:-100}
      AGENT_FAILURE_MODE: ${AGENT_FAILURE_MODE:-none}
      AGENT_FAILURE_RATE: ${AGENT_FAILURE_RATE:-1}
      AGENT_FAILURE_DELAY_MS: ${AGENT_FAILURE_DELAY_MS:-0}
      AGENT_MEMORY_WINDOW_DAYS: ${AGENT_MEMORY_WINDOW_DAYS:-30}
      CONTRACTS_PATH: /contracts
    volumes:
      - ./agent_mock:/app
      - ./contracts:/contracts:ro
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      web-lb:
        condition: service_started

  # Observabilidade. O metrics lê audit_events por cursor e as tabelas do Solid Queue e serve
  # GET /metrics na porta 9394, só na rede do Compose. Uma réplica só: o cursor das latências fica na
  # memória do processo. Duas conexões: a da thread de coleta e a do Puma.
  metrics:
    <<: *rails
    command: ["bundle", "exec", "puma", "-C", "config/puma_metrics.rb", "metrics.ru"]
    environment:
      <<: *rails-environment
      RAILS_MAX_THREADS: "2"

  # Cria ou atualiza o papel de monitoração do Postgres (pg_monitor, sem acesso ao domínio) com o
  # superusuário, a cada subida; termina depois de rodar.
  postgres-monitor-init:
    image: postgres:18
    entrypoint: ["/bin/bash", "/scripts/create-monitor-role.sh"]
    environment:
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_SUPERUSER: ${POSTGRES_SUPERUSER}
      DB_MONITOR_USERNAME: ${DB_MONITOR_USERNAME:-cloudesk_monitor}
      DB_MONITOR_PASSWORD: ${DB_MONITOR_PASSWORD}
    volumes:
      - ./infra/postgres/monitor:/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # TPS e conexões do Postgres, com o papel de monitoração.
  postgres-exporter:
    image: ghcr.io/prometheus-community/postgres-exporter:v0.21.1
    environment:
      DATA_SOURCE_URI: postgres:5432/${DB_DEVELOPMENT_NAME}?sslmode=disable
      DATA_SOURCE_USER: ${DB_MONITOR_USERNAME:-cloudesk_monitor}
      DATA_SOURCE_PASS: ${DB_MONITOR_PASSWORD}
    depends_on:
      postgres-monitor-init:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:v3.16.0
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  # Grafana em http://localhost:3002: dashboards e alertas provisionados por arquivo, cockpit como
  # página inicial e acesso anônimo só de leitura.
  grafana:
    image: grafana/grafana:13.3.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/cockpit-operacional.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3002:3000"
    depends_on:
      - prometheus

  # Kit de conformidade do agente, só no profile conformance:
  #   docker compose --profile conformance up --build --abort-on-container-exit   #     --exit-code-from agent-conformance agent-conformance agent-mock-conformance
  # O agent-conformance sobe o Core falso na porta 8080 e roda o pytest contra o agente sob teste,
  # pelos tópicos conformance.inbound e conformance.outbound.
  agent-conformance:
    build: ./agent_conformance
    image: cloudesk-agent-conformance:dev
    profiles: [conformance]
    command: ["pytest"]
    environment:
      KAFKA_BROKERS: ${KAFKA_BROKERS:-redpanda:9092}
      CONFORMANCE_CONTEXT_SECRET: ${AGENT_CONTEXT_SECRET}
      CONTRACTS_PATH: /contracts
    volumes:
      - ./agent_conformance:/app
      - ./contracts:/contracts:ro
    depends_on:
      redpanda-init:
        condition: service_completed_successfully

  # Agente sob teste do kit: mesma imagem do agent-mock, nos tópicos do kit e com o Core falso.
  agent-mock-conformance:
    build: ./agent_mock
    image: cloudesk-agent-mock:dev
    profiles: [conformance]
    environment:
      KAFKA_BROKERS: ${KAFKA_BROKERS:-redpanda:9092}
      CORE_URL: http://agent-conformance:8080
      AGENT_CONTEXT_SECRET: ${AGENT_CONTEXT_SECRET}
      AGENT_GROUP_ID: cloudesk-agent-conformance
      AGENT_INBOUND_TOPIC: conformance.inbound
      AGENT_OUTBOUND_TOPIC: conformance.outbound
      AGENT_LATENCY_MS: "0"
      AGENT_CONCURRENCY: ${AGENT_CONCURRENCY:-100}
      AGENT_FAILURE_MODE: none
      AGENT_FAILURE_RATE: ${AGENT_FAILURE_RATE:-1}
      AGENT_FAILURE_DELAY_MS: ${AGENT_FAILURE_DELAY_MS:-0}
      AGENT_MEMORY_WINDOW_DAYS: ${AGENT_MEMORY_WINDOW_DAYS:-30}
      CONTRACTS_PATH: /contracts
    volumes:
      - ./agent_mock:/app
      - ./contracts:/contracts:ro
    depends_on:
      redpanda-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  redpanda-data:
  prometheus-data:
  grafana-data:
